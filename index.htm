<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <title>Clock</title>
</head>
<body>
    <header>
        <div class="banner">
            <h1 id="current-date">Today's Date</h1>
        </div>
        <div class="login">
            <h1 id="current-clock">Clock</h1>
        </div>
    </header>

    <script>
        function updateDateTime() {
            const now = new Date();

        const h = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', weekday: 'long' });
        const t = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', day: 'numeric' });
        const b = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', month: 'long' });
        const thn = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', year: 'numeric' });
        document.getElementById('current-date').textContent = `${h}, ${t} ${b} ${thn}`;

            const timeOptions = { 
            timeZone: 'Asia/Jakarta', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: false
            };

            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            document.getElementById('current-clock').textContent = timeString + " WIB";
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
    <div class="backgroundbox">
        <div class="tite">
            <h1>Welcome to the Clock Page</h1>
        </div>
        <div class="titel info">
            <p>This page displays the current date and time in the Asia/Jakarta timezone.</p>
        </div>
    </div>
    <div class="mainmainconten">
        <table class="table">
            <tr>
                <thead>
                <th>Kelas</th>
                <th>Suhu</th>
                <th>Kelembapan</th>

            </thead>
            <tbody>
                <tr>
                    <td>XI-3</td>
                    <td id="temp-display">0.0 &deg;C</td>
                    <td id="humid-display">0.0%</td>
                </tr>
                <tr>
                    <td>XI-4</td>
                    <td>26°C</td>
                    <td>58%</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://esp32-gesen-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const sensorRef = ref(db, 'weather');
        
        onValue(sensorRef, (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById("temp-display").innerHTML = data.temperature.toFixed(1) + " &deg;C";
                document.getElementById("humid-display").innerHTML = data.humidity.toFixed(1) + " %";
            }
        });
    </script>
</body>
